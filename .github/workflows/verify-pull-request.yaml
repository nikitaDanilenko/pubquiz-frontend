name: Verify Pull Request

on:
  pull_request:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Elm, and elm-test
        run: |
          npm install elm -g
          npm install elm-test -g

      - name: Run tests
        run: elm-test
