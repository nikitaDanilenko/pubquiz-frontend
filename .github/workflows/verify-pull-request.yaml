name: Verify Pull Request

on:
  pull_request:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install Elm, and elm-test
        run: |
          npm install elm -g
          npm install elm-test -g

      - name: Run tests
        run: elm-test
